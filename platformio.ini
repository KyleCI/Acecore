; Acecore Powercell collector firmware 2.x
[common]
base_flags =
    -D POWERCELL_FIRMWARE_KIND=\"collector\"
; 2.5.5: CORE_DEBUG_LEVEL=0 drops raw Arduino core log_e lines ([E][Wire.cpp] i2cRead Error 263)
    -D CORE_DEBUG_LEVEL=0
    -Wall
; Live cloud (Caleb 2026-10-26): api-dev.acecore.tech, TLS only.
; config.h refuses cleartext unless POWERCELL_DEV_BUILD and POWERCELL_DEV_INSECURE are both set.
; 2.5.36 (Caleb 18 Nov 2026): LoRa socket power V x I (apparent VA), collector side only. See CHANGELOG.
; 2.5.36 (Caleb 18 Nov 2026 16:51 WAT): back to JK-PB on all six images, as 2.5.33: JK-PB
; 115200 8N1 listen-only on Serial2 ESP RX GPIO17 / TX GPIO16 (DSP envs DSP_BMS_JKPB=1).
; The 2.5.35 JBD poller is kept, compiled out. To select JBD again: add ${common.bms_jbd} to an
; env (and set DSP_BMS_JKPB=0 on DSP envs).
bms_jbd =
    -D POWERCELL_BMS_JBD=1
live_backend =
    -D POWERCELL_WS_HOST=\"api-dev.acecore.tech\"
    -D POWERCELL_WS_PORT=443
    -D POWERCELL_WS_TLS=1
    -D POWERCELL_OTA_BASE_URL_DEFAULT=\"https://api-dev.acecore.tech\"

[platformio]
default_envs = esp32dev_stm01_5kw

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
; CP2102 links on these boards are unreliable above 115200.
upload_speed = 115200
; min_spiffs.csv (Caleb approved 2026-10-23): app0/app1 0x1E0000 (1.875 MB) each, was 0x140000.
; NVS 0x9000/0x5000 and otadata 0xe000/0x2000 are unchanged, so settings, device_secret,
; label values and onboarding survive. The firmware uses no SPIFFS/LittleFS (64 KB spiffs left unused).
; OTA cannot change the partition table: every unit needs ONE USB reflash of the merged bin
; (bootloader + partitions + app). An OTA image > 0x140000 must never go to a default.csv unit.
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.base_flags}
    ${common.live_backend}
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    esp32async/ESPAsyncWebServer@^3.11.0
    esp32async/AsyncTCP@^3.4.10
    links2004/WebSockets@^2.7.1
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit BusIO@^1.15.0
    sandeepmistry/LoRa@^0.8.0

; STM32 collectors. Same 2.5.11 code paths. Only the OTA model and version differ.
; Version 2.5.39 matches the DSP images. The model in the identity keeps them apart.
[env:esp32dev_stm01_5kw]
build_flags =
    ${common.base_flags}
    ${common.live_backend}
    -D POWERCELL_HARDWARE_MODEL=\"pc-stm01-5kw\"
    -D POWERCELL_FIRMWARE_VERSION=\"2.5.39\"

[env:esp32dev_stm01_35kw]
build_flags =
    ${common.base_flags}
    ${common.live_backend}
    -D POWERCELL_HARDWARE_MODEL=\"pc-stm01-35kw\"
    -D POWERCELL_FIRMWARE_VERSION=\"2.5.39\"

; 2.5.33: Powercell Prime 1.5 kVA / 3 kWh (Caleb 16 Nov 2026). Like the other STM images it
; carries no factory rating; NVS model PC1_5K (1.5 kVA / 1.35 kW) is PROVISIONAL, scaled from
; 3.5 kVA until the real 1.5 kVA hardware specs are confirmed.
[env:esp32dev_stm01_15kw]
build_flags =
    ${common.base_flags}
    ${common.live_backend}
    -D POWERCELL_HARDWARE_MODEL=\"pc-stm01-15kw\"
    -D POWERCELL_FIRMWARE_VERSION=\"2.5.39\"

; DSP hardware v0.1.1. No STM32. 2.5.38 (Caleb 18 Nov 2026 18:08 WAT): LoRa is fitted on every
; board, DSP included: SX1278 on shared SPI 18/19/23, CS IO4, RST IO26, polled; SD keeps CS IO5.
; Smart sockets over LoRa, socket VA = PZEM voltage x socket current. 2.5.39 (Caleb 19 Nov 01:12 WAT):
; the per-socket rules (schedules, SoC shed, overload, cloud override, low-power radio) run on DSP too,
; JK-PB SoC and DS3231/NTP/phone time. Each rating has its own OTA model.
[env:esp32dev_dsp011_5kw]
build_flags =
    ${common.base_flags}
    ${common.live_backend}
    -D POWERCELL_DSP011=1
    -D FEATURE_LORA=1
    -D FEATURE_STM32=0
    -D FEATURE_BAT_SENSE_ADC=0
    -D DSP_BMS_UART_SWAP=0
    -D DSP_BMS_JKPB=1
    -D DSP_PWR_ACTIVE_LEVEL=1
    -D POWERCELL_FACTORY_RATED_ACTIVE_W=5000
    -D POWERCELL_FACTORY_VARIANT=\"pc-dsp011-5kw\"
    -D POWERCELL_HARDWARE_MODEL=\"pc-dsp011-5kw\"
    -D POWERCELL_FIRMWARE_VERSION=\"2.5.39\"
    -Wl,--wrap=uart_write_bytes

[env:esp32dev_dsp011_35kw]
build_flags =
    ${common.base_flags}
    ${common.live_backend}
    -D POWERCELL_DSP011=1
    -D FEATURE_LORA=1
    -D FEATURE_STM32=0
    -D FEATURE_BAT_SENSE_ADC=0
    -D DSP_BMS_UART_SWAP=0
    -D DSP_BMS_JKPB=1
    -D DSP_PWR_ACTIVE_LEVEL=1
    -D POWERCELL_FACTORY_RATED_ACTIVE_W=3500
    -D POWERCELL_FACTORY_VARIANT=\"pc-dsp011-35kw\"
    -D POWERCELL_HARDWARE_MODEL=\"pc-dsp011-35kw\"
    -D POWERCELL_FIRMWARE_VERSION=\"2.5.39\"
    -Wl,--wrap=uart_write_bytes

; 2.5.33: Powercell Prime 1.5 kVA. PROVISIONAL rating 1500 W, usable 1350 W (3150/3500 of rated),
; scaled from the 3.5 kVA image. Same pins and BMS selection as the 35kw DSP image.
[env:esp32dev_dsp011_15kw]
build_flags =
    ${common.base_flags}
    ${common.live_backend}
    -D POWERCELL_DSP011=1
    -D FEATURE_LORA=1
    -D FEATURE_STM32=0
    -D FEATURE_BAT_SENSE_ADC=0
    -D DSP_BMS_UART_SWAP=0
    -D DSP_BMS_JKPB=1
    -D DSP_PWR_ACTIVE_LEVEL=1
    -D POWERCELL_FACTORY_RATED_ACTIVE_W=1500
    -D POWERCELL_FACTORY_VARIANT=\"pc-dsp011-15kw\"
    -D POWERCELL_HARDWARE_MODEL=\"pc-dsp011-15kw\"
    -D POWERCELL_FIRMWARE_VERSION=\"2.5.39\"
    -Wl,--wrap=uart_write_bytes
