; Acecore Powercell collector firmware 2.5.0
;
; Caleb 2026-10-26: api-dev.acecore.tech is the live Upload cloud.
; `pio run` / PlatformIO Upload with no env selected uses default_envs = esp32dev
; and talks to api-dev. Production api.acecore.tech is esp32dev_prod only.
; OTA hardware model stays "esp32dev" on every env (include/config.h) so existing
; units, including ACE9678, still match the backend model string.
[common]
base_flags =
    -D POWERCELL_FIRMWARE_KIND=\"collector\"
    -D POWERCELL_FIRMWARE_VERSION=\"2.5.0\"
    -Wall
; Live cloud. TLS. This is what Upload hits.
live_backend =
    -D POWERCELL_WS_HOST=\"api-dev.acecore.tech\"
    -D POWERCELL_WS_PORT=443
    -D POWERCELL_WS_TLS=1
    -D POWERCELL_WS_PATH=\"/ws/device\"
    -D POWERCELL_OTA_BASE_URL_DEFAULT=\"https://api-dev.acecore.tech\"
; Production cloud. TLS. Not the default. Pick this env on purpose.
prod_backend =
    -D POWERCELL_WS_HOST=\"api.acecore.tech\"
    -D POWERCELL_WS_PORT=443
    -D POWERCELL_WS_TLS=1
    -D POWERCELL_WS_PATH=\"/ws/device\"
    -D POWERCELL_OTA_BASE_URL_DEFAULT=\"https://api.acecore.tech\"

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
; CP2102 links on these boards are unreliable above 115200.
upload_speed = 115200
; min_spiffs.csv is the Arduino-ESP32 2.0.17 table (tools/partitions/min_spiffs.csv).
; app0/app1 are 0x1E0000 (1.875 MB) each; 1.0.1 default.csv was 0x140000.
; NVS 0x9000/0x5000 and otadata 0xe000/0x2000 are unchanged.
; SPIFFS is 0x20000 and unused (no filesystem).
; After factory identity is in NVS: never erase flash, and never flash a merged
; image (bootloader + partitions + app). App-only upload keeps the identity.
; An OTA image > 0x140000 must never go to a unit still on default.csv.
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.base_flags}
    ${common.live_backend}
; 1.0.x OTA client used by smart-socket-firmware. Collector OTA is src/ota.cpp.
lib_ignore = PowercellOTA
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    esp32async/ESPAsyncWebServer@^3.11.0
    esp32async/AsyncTCP@^3.4.10
    links2004/WebSockets@^2.7.1
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit BusIO@^1.15.0
    sandeepmistry/LoRa@^0.8.0

; Default. Upload with no env selected. Live cloud api-dev.acecore.tech.
; Model string remains esp32dev (not overridden here).
[env:esp32dev]

; Production api.acecore.tech. Do not use this unless you intend to leave the live cloud.
[env:esp32dev_prod]
build_flags =
    ${common.base_flags}
    ${common.prod_backend}

; STM32 framed protocol at 115200, still on the live api-dev cloud.
[env:esp32dev_framed]
build_flags = ${env.build_flags} -D STM32_LINK_PROTOCOL=1

; Bench build without the LoRa radio (IO26 then free for the STM32 NRST bodge).
; Still on the live api-dev cloud.
[env:esp32dev_nolora]
build_flags = ${env.build_flags} -D FEATURE_LORA=0 -D FEATURE_ESPNOW_SOCKETS=1

; Bare-board variant of the live cloud (same hosts as esp32dev).
; IO34 is not a battery on a bare module. Not cleartext.
; No secrets in flags. Provision over USB with tools/provision.py.
[env:esp32dev_dev]
build_flags =
    ${common.base_flags}
    ${common.live_backend}
    -D POWERCELL_DEV_BUILD=1
    -D FEATURE_BAT_SENSE_ADC=0
