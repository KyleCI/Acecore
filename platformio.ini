; Acecore Powercell collector firmware 2.x
[common]
base_flags =
    -D POWERCELL_FIRMWARE_KIND=\"collector\"
; 2.5.5: CORE_DEBUG_LEVEL=0 drops raw Arduino core log_e lines ([E][Wire.cpp] i2cRead Error 263)
    -D CORE_DEBUG_LEVEL=0
    -Wall
; Stock version is a single flag. Hardware envs set 2.5.13 themselves so this is not redefined.
version_stock =
    -D POWERCELL_FIRMWARE_VERSION=\"2.5.11\"
; Live / default Upload cloud (Caleb 2026-10-26): api-dev.acecore.tech, TLS only.
; config.h refuses cleartext outside esp32dev_dev + POWERCELL_DEV_INSECURE.
live_backend =
    -D POWERCELL_WS_HOST=\"api-dev.acecore.tech\"
    -D POWERCELL_WS_PORT=443
    -D POWERCELL_WS_TLS=1
    -D POWERCELL_OTA_BASE_URL_DEFAULT=\"https://api-dev.acecore.tech\"
; Opt-in production (Destiny) cloud. Use: pio run -e esp32dev_prod
prod_backend =
    -D POWERCELL_WS_HOST=\"api.acecore.tech\"
    -D POWERCELL_WS_PORT=443
    -D POWERCELL_WS_TLS=1
    -D POWERCELL_OTA_BASE_URL_DEFAULT=\"https://api.acecore.tech\"

[platformio]
default_envs = esp32dev_stm01_5kw

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
; CP2102 links on these boards are unreliable above 115200.
upload_speed = 115200
; min_spiffs.csv (Caleb approved 2026-10-23): app0/app1 0x1E0000 (1.875 MB) each, was 0x140000.
; NVS 0x9000/0x5000 and otadata 0xe000/0x2000 are unchanged, so settings, device_secret,
; label values and onboarding survive. The firmware uses no SPIFFS/LittleFS (64 KB spiffs left unused).
; OTA cannot change the partition table: every unit needs ONE USB reflash of the merged bin
; (bootloader + partitions + app). An OTA image > 0x140000 must never go to a default.csv unit.
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.base_flags}
    ${common.version_stock}
    ${common.live_backend}
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    esp32async/ESPAsyncWebServer@^3.11.0
    esp32async/AsyncTCP@^3.4.10
    links2004/WebSockets@^2.7.1
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit BusIO@^1.15.0
    sandeepmistry/LoRa@^0.8.0

; STM32 collectors. Same 2.5.11 code paths. Only the OTA model and version differ.
; Version 2.5.13 matches the DSP images. The model in the identity keeps them apart.
[env:esp32dev_stm01_5kw]
build_flags =
    ${common.base_flags}
    ${common.live_backend}
    -D POWERCELL_HARDWARE_MODEL=\"pc-stm01-5kw\"
    -D POWERCELL_FIRMWARE_VERSION=\"2.5.13\"

[env:esp32dev_stm01_35kw]
build_flags =
    ${common.base_flags}
    ${common.live_backend}
    -D POWERCELL_HARDWARE_MODEL=\"pc-stm01-35kw\"
    -D POWERCELL_FIRMWARE_VERSION=\"2.5.13\"

; STM32 framed protocol at 115200, for bench work once the STM32 side ships it
[env:esp32dev_framed]
build_flags = ${env.build_flags} -D STM32_LINK_PROTOCOL=1

; Bench build without the LoRa radio (IO26 then free for the STM32 NRST bodge)
[env:esp32dev_nolora]
build_flags = ${env.build_flags} -D FEATURE_LORA=0 -D FEATURE_ESPNOW_SOCKETS=1  ; no LoRa module: legacy ESP-NOW socket path

; Opt-in production Destiny cloud api.acecore.tech (TLS only).
; Same OTA model string "esp32dev" (from config.h); only the host differs.
[env:esp32dev_prod]
build_flags =
    ${common.base_flags}
    ${common.version_stock}
    ${common.prod_backend}

; DSP hardware v0.1.1. No STM32 and no LoRa. Each rating has its own OTA model.
[env:esp32dev_hw_v011_5kw]
build_flags =
    ${common.base_flags}
    ${common.live_backend}
    -D POWERCELL_HW_V011=1
    -D FEATURE_LORA=0
    -D FEATURE_STM32=0
    -D POWERCELL_FACTORY_RATED_ACTIVE_W=5000
    -D POWERCELL_FACTORY_VARIANT=\"hw-v0.1.1-5kw\"
    -D POWERCELL_HARDWARE_MODEL=\"pc-dsp011-5kw\"
    -D POWERCELL_FIRMWARE_VERSION=\"2.5.13\"
    -Wl,--wrap=uart_write_bytes

[env:esp32dev_hw_v011_35kw]
build_flags =
    ${common.base_flags}
    ${common.live_backend}
    -D POWERCELL_HW_V011=1
    -D FEATURE_LORA=0
    -D FEATURE_STM32=0
    -D POWERCELL_FACTORY_RATED_ACTIVE_W=3500
    -D POWERCELL_FACTORY_VARIANT=\"hw-v0.1.1-3.5kw\"
    -D POWERCELL_HARDWARE_MODEL=\"pc-dsp011-35kw\"
    -D POWERCELL_FIRMWARE_VERSION=\"2.5.13\"
    -Wl,--wrap=uart_write_bytes

; Bare-board bench for the same live host api-dev.acecore.tech (TLS, Let's Encrypt).
; wss://api-dev.acecore.tech/ws/device, OTA base https://api-dev.acecore.tech (the firmware
; appends /api/ota/check and /api/ota/download). Unauthenticated sockets are closed with 4401.
; No secrets in flags: API key, device secret and Wi-Fi are provisioned over USB with
; tools/provision.py (see /workspace/esp32_dev_build/FLASHING.md).
; Differs from default Upload: POWERCELL_DEV_BUILD=1 and BAT_SENSE ADC off for bare boards.
[env:esp32dev_dev]
build_flags =
    ${common.base_flags}
    ${common.version_stock}
    -D POWERCELL_DEV_BUILD=1
    -D POWERCELL_WS_HOST=\"api-dev.acecore.tech\"
    -D POWERCELL_WS_PORT=443
    -D POWERCELL_WS_TLS=1
    -D POWERCELL_WS_PATH=\"/ws/device\"
    -D POWERCELL_OTA_BASE_URL_DEFAULT=\"https://api-dev.acecore.tech\"
    ; bare board: nothing drives IO34, so do not read it as a battery
    -D FEATURE_BAT_SENSE_ADC=0
