; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
; CP2102 links on this device become unreliable at the default 460800 baud.
upload_speed = 115200
board_build.filesystem = spiffs
board_build.partitions = default.csv
; Archived ESP-NOW UI references headers absent from the active LoRa project.
build_src_filter = +<*> -<webinterface.cpp>
build_flags =
    -D POWERCELL_FIRMWARE_KIND=\"collector\"
    -D POWERCELL_FIRMWARE_VERSION=\"1.0.1\"
    -D POWERCELL_WS_HOST=\"api.acecore.tech\"
    -D POWERCELL_WS_PORT=443
    -D POWERCELL_WS_TLS=1
lib_deps = 
	bblanchon/ArduinoJson@^7.4.3
	esp32async/ESPAsyncWebServer@^3.11.0
	esp32async/AsyncTCP@^3.4.10
	links2004/WebSockets@^2.7.1
	sandeepmistry/LoRa@^0.8.0
	openenergymonitor/EmonLib@^1.1.0
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    adafruit/Adafruit BusIO  @ ^1.15.0 
monitor_echo = true

; Hardware v0.1.1 shared flags. This env has no factory rating. Do not flash it
; onto a 5 kW or 3.5 kW unit. The factory images are the two envs below.
; Not the default env. Do not publish this hardware model as an OTA job yet.
[env:esp32dev_hw_v011]
extends = env:esp32dev
board_build.partitions = partitions_hw_v011.csv
build_flags =
    ${env:esp32dev.build_flags}
    -D POWERCELL_HW_V011=1
    -D POWERCELL_HARDWARE_MODEL=\"hw-v0.1.1\"
    -D POWERCELL_SD_CS=33
    -D PZEM_RX_GPIO=25
    -D PZEM_TX_GPIO=26
    -D PZEM_ADDRESS=0xF8
    -Wl,--wrap=uart_write_bytes

[env:esp32dev_hw_v011_5kw]
extends = env:esp32dev_hw_v011
build_flags =
    ${env:esp32dev_hw_v011.build_flags}
    -D POWERCELL_FACTORY_RATED_ACTIVE_W=5000
    -D POWERCELL_FACTORY_VARIANT=\"hw-v0.1.1-5kw\"

[env:esp32dev_hw_v011_35kw]
extends = env:esp32dev_hw_v011
build_flags =
    ${env:esp32dev_hw_v011.build_flags}
    -D POWERCELL_FACTORY_RATED_ACTIVE_W=3500
    -D POWERCELL_FACTORY_VARIANT=\"hw-v0.1.1-3.5kw\"

[env:esp32dev_local]
extends = env:esp32dev
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
build_flags =
    ${env:esp32dev.build_flags}


; USB migration only: persists include/secrets.h API key into NVS.
; Never upload this binary to the OTA release library.
[env:esp32dev_usb_bootstrap]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D POWERCELL_BOOTSTRAP_CREDENTIALS=1
