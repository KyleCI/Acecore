[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = default.csv
lib_extra_dirs = ../lib
build_flags =
  -I ../include
  -D POWERCELL_FIRMWARE_KIND=\"socket\"
  -D POWERCELL_FIRMWARE_VERSION=\"1.0.0\"
lib_deps =
  bblanchon/ArduinoJson@^7.4.3
  sandeepmistry/LoRa@^0.8.0
  openenergymonitor/EmonLib@^1.1.0

