; AcePlug v0.1 firmware. Ships with collector 2.5.0.
; RF: include/powercell_lora_profile.h (433 MHz, SF9, BW 125 kHz, CR 4/5,
; preamble 12, sync 0xF1, CRC on, TX 20 dBm). Not the old 915 MHz SF7 image.
; Pins are CAD-verified v0.1 (Smart Socket.kicad U3): RELAY 15, NSS/CS 5,
; RST 25, DIO0 26, SPI 18/19/23, LED 4, ZMCT103 CT on ADC 35 (EmonLib, not BL0942).
; Schematic symbol RFM95W-915S2 is not the air profile; fit a 433 MHz module.
; Not v0.2 (RELAY 27, CS 32, RST 26, DIO0 34, BL0942 UART 16/17).
; Not the LORA_SOCKET_PROTOCOL.md map (GPIO 14/4/2/33/22/21).
; Software protection for a 10 A contact: 8 A warn, 10 A trip.
; No upload_port here: pick the serial port at upload time.
[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = default.csv
lib_extra_dirs = ../lib
build_flags =
  -I ../include
  -D POWERCELL_FIRMWARE_KIND=\"socket\"
  -D POWERCELL_FIRMWARE_VERSION=\"2.5.0\"
lib_deps =
  bblanchon/ArduinoJson@^7.4.3
  sandeepmistry/LoRa@^0.8.0
  openenergymonitor/EmonLib@^1.1.0
