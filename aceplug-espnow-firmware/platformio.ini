; AcePlug v0.1 smart socket, ESP-NOW, firmware 1.1.0-espnow-event (Caleb 19 Nov 2026 16:19 WAT).
; *** EVENT/DEMO BUILD ONLY. NOT FOR CUSTOMER UNITS. ***
; Pairs with collector 2.5.40. Uses the existing reference ESP-NOW keys from the local, never-committed
; ../include/espnow_pairing.h (same file as the collector event build; template ../include/espnow_pairing.h.example).
; Rotate the keys before any customer build.
; Base: reference socket 1.0.1 ("Col PL.zip"). 10 A trip / 8 A warn / 3-trips lockout / noise floor from the
; LoRa AcePlug firmware (537d7f0, 1.0.3). Wire format: ../lib/pc_core/src/espnow_wire.h (shared with the collector).
[env:aceplug_espnow_event]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
; Same as socket 1.0.1: two OTA app slots, NVS 0x9000.
board_build.partitions = default.csv
lib_extra_dirs = ../lib
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -I include
  -I ../include
  -D POWERCELL_FIRMWARE_KIND=\"socket\"
  -D POWERCELL_FIRMWARE_VERSION=\"1.1.0-espnow-event\"
  -D ACEPLUG_FW_MAJOR=1
  -D ACEPLUG_FW_MINOR=1
  -D ACEPLUG_FW_PATCH=0
; EVENT/DEMO ONLY: compile in the keys from ../include/espnow_pairing.h. Drop after key rotation.
  -D POWERCELL_ESPNOW_EVENT_KEYS=1
lib_deps =
  bblanchon/ArduinoJson@^7.4.3
  openenergymonitor/EmonLib@^1.1.0
